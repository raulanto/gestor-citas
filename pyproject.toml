[project]
name = "agenda-citas"
version = "0.1.0"
description = "Microapp para gestionar citas"
readme = "README.md"
authors = [
    { name = "Raul antonio de la cruz hernandez", email = "detretaty@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=5.1.0",
    "django-filter>=26.2",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "python-decouple>=3.8",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
