      - RESCHEDULED
      - EXPIRED
      type: string
      description: |-
        * `REQUESTED` - Solicitada
        * `CONFIRMED` - Confirmada
        * `WAITLISTED` - En espera
        * `CANCELLED` - Cancelada
        * `COMPLETED` - Completada
        * `NO_SHOW` - No presentado
        * `RESCHEDULED` - Reprogramada
        * `EXPIRED` - Expirada
