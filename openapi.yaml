      - full_name
      - id
      - phone
    RequesterInput:
      type: object
      description: Input serializer for requester contact details in appointment booking.
      properties:
        full_name:
          type: string
          maxLength: 150
        phone:
          type: string
          default: ''
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
      required:
      - full_name
    RequesterPublicDetail:
      type: object
      description: Public requester serializer with minimal personal data (no phone,
        no email).
      properties:
        id:
          type: integer
        full_name:
          type: string
      required:
      - full_name
      - id
    RequesterWorkerDetail:
      type: object
      description: Worker requester serializer with contact phone for appointment
        fulfillment (no email).
      properties:
        id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
      required:
      - full_name
      - id
      - phone
    RotateTokenResponse:
      type: object
      description: Response serializer for rotating an appointment manage token.
      properties:
        appointment_id:
          type: string
          format: uuid
        manage_token:
          type: string
      required:
      - appointment_id
      - manage_token
    ScheduleChangeResponse:
      type: object
      description: Response serializer for worker schedule changes impact.
      properties:
        applied:
          type: boolean
          description: Indica si los cambios fueron aplicados en la base de datos.
        impact:
          type: object
          additionalProperties: {}
          description: Desglose del impacto sobre citas existentes.
      required:
      - applied
      - impact
    ScheduleExceptionCreate:
      type: object
      description: Input serializer for creating a schedule exception.
      properties:
        date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/KindEnum'
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
        break_start:
          type: string
          format: time
          nullable: true
        break_end:
