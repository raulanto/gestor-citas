openapi: 3.0.3
info:
  title: Agenda de Citas API
  version: 1.0.0
  description: Microapp Django + DRF para gestión de citas, cupos por día, asignación
    automática de personal, lista de espera FIFO y horarios configurables.
paths:
  /api/v1/appointments/:
    get:
      operationId: appointments_list
      description: Permite al personal Staff consultar y filtrar citas por fecha,
        rango de fechas (hasta 92 días), estados múltiples, trabajador, servicio,
        inatendibles y ordenamiento.
      summary: Listar citas con filtros y paginación (Staff)
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Filtrar por fecha exacta (YYYY-MM-DD).
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Fecha inicial del rango (YYYY-MM-DD).
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Fecha final del rango (YYYY-MM-DD, máximo 92 días).
      - in: query
        name: limit
        schema:
          type: integer
        description: Número de resultados por página (default 25, max 100).
      - in: query
        name: offset
        schema:
          type: integer
        description: Desplazamiento inicial para paginación.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Ordenamiento: start_at, -start_at, created_at, -created_at.'
      - in: query
        name: service
        schema:
          type: integer
        description: ID del servicio.
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Estado(s) de la cita (ej. CONFIRMED, WAITLISTED).
      - in: query
        name: unserviceable
        schema:
          type: boolean
        description: Filtrar solo citas en espera inatendibles.
      - in: query
        name: worker
        schema:
          type: integer
        description: ID del trabajador asignado.
      tags:
      - Citas
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAppointmentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: appointments_create
      description: Reserva una cita con asignación óptima de personal o colocación
        en lista de espera. Devuelve un 'manage_token' de gestión única vez para que
        el solicitante administre su cita.
      summary: Solicitar nueva cita (Público)
      tags:
      - Citas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentBookingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: Devuelve el detalle de la cita. El solicitante debe proveer 'X-Manage-Token'.
        La exposición de datos personales se segrega por rol (mínima para solicitante,
        operativa para trabajador, total para staff).
      summary: Detalle de cita por UUID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAppointmentDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/cancel/:
    post:
      operationId: appointments_cancel_create
      description: Cancela una cita liberando el horario y recalculando la lista de
        espera. El solicitante requiere 'X-Manage-Token'. Staff puede usar 'force=true'.
      summary: Cancelar cita
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCancel'
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAppointmentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/complete/:
    post:
      operationId: appointments_complete_create
      description: Transiciona una cita CONFIRMED a COMPLETADA (solo trabajador asignado
        o staff).
      summary: Marcar cita como completada
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAppointmentDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/no-show/:
    post:
      operationId: appointments_no_show_create
      description: Transiciona una cita CONFIRMED a NO_SHOW (solo trabajador asignado
        o staff).
      summary: Marcar inasistencia de cita
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerAppointmentDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/reschedule/:
    post:
      operationId: appointments_reschedule_create
      description: Reprograma una cita a un nuevo horario atómicamente. Devuelve un
        nuevo 'manage_token' para la nueva cita.
      summary: Reprogramar cita
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentBookingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/appointments/{id}/token/:
    post:
      operationId: appointments_token_create
      description: Genera un nuevo token de gestión para la cita e invalida el anterior
        registrando auditoría.
      summary: Rotar token de gestión de cita (Staff)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Citas
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoca el token de refresco agregándolo a la lista negra (blacklist).
      summary: Cerrar sesión (Invalidar token de refresco)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retorna el identificador, nombre de usuario, rol efectivo y worker_id
        vinculado.
      summary: Perfil del usuario autenticado
      tags:
      - Autenticación
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: Autentica usuarios con usuario y contraseña. Devuelve tokens de
        acceso y refresco. Tras 5 intentos fallidos para un mismo usuario, se bloquea
        por 15 minutos.
      summary: Iniciar sesión (Obtener tokens JWT)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Genera un nuevo token de acceso a partir de un token de refresco
        válido con rotación.
      summary: Refrescar token de acceso
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/availability/:
    get:
      operationId: availability_retrieve
      description: Calcula los intervalos horarios libres y el cupo restante para
        un servicio en una fecha.
      summary: Consultar disponibilidad y cupos de un día
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: service
        schema:
          type: integer
          minimum: 1
        required: true
      tags:
      - Disponibilidad
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayAvailability'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/day-configs/{date}/:
    get:
      operationId: day_configs_retrieve
      description: Obtiene el cupo configurado, estado de apertura y métricas del
        día.
      summary: Consultar configuración de una fecha específica (Staff)
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - Configuración de Días
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayConfigSummaryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: day_configs_update
      description: Sobrescribe cupo máximo o estado de apertura de una fecha específica.
      summary: Actualizar configuración de una fecha específica (Staff)
      parameters:
      - in: path
        name: date
        schema:
          type: string
        required: true
      tags:
      - Configuración de Días
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayConfigSummaryResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/day-configs/weekday/{weekday}/:
    get:
      operationId: day_configs_weekday_retrieve
      description: Obtiene la configuración semanal por defecto para un día (0=Lunes,
        6=Domingo).
      summary: Consultar configuración por defecto de día de la semana (Staff)
      parameters:
      - in: path
        name: weekday
        schema:
          type: integer
        required: true
      tags:
      - Configuración de Días
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayConfigDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: day_configs_weekday_update
      description: Actualiza el cupo o estado de apertura semanal por defecto para
        un día (0=Lunes, 6=Domingo).
      summary: Actualizar configuración por defecto de día de la semana (Staff)
      parameters:
      - in: path
        name: weekday
        schema:
          type: integer
        required: true
      tags:
      - Configuración de Días
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DayConfigUpdate'
        required: true
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayConfigDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Confirma que el servidor web y el proceso de la aplicación están
        respondiendo.
      summary: Verificación de vivacidad (Liveness)
      tags:
      - Salud
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Verifica la conectividad con dependencias críticas (base de datos
        y caché/Redis). Devuelve 200 OK si ambas responden; 503 con la lista de servicios
        caídos si alguna falla.
      summary: Verificación de disponibilidad (Readiness)
      tags:
      - Salud
      security:
      - BearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
          description: ''
  /api/v1/me/agenda/:
