components:
  schemas:
    AppointmentBookingResponse:
      type: object
      description: Appointment response serializer for booking and reschedule with
        one-time manage_token.
      properties:
        manage_token:
          type: string
          nullable: true
          readOnly: true
        requester:
          $ref: '#/components/schemas/RequesterPublicDetail'
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Estado
        service:
          $ref: '#/components/schemas/ServiceSummary'
        date:
          type: string
          format: date
          title: Fecha
        start_at:
          type: string
          format: date-time
          title: Inicio
        end_at:
          type: string
          format: date-time
          title: Fin
        worker_name:
          type: string
          nullable: true
          readOnly: true
        waitlist_position:
          type: integer
          nullable: true
          readOnly: true
        reschedule_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Número de reprogramaciones
        reschedules_remaining:
          type: integer
          readOnly: true
        can_cancel_until:
          type: string
          nullable: true
          readOnly: true
        rescheduled_from:
          type: string
          format: uuid
          nullable: true
        rescheduled_to:
          type: string
          nullable: true
          readOnly: true
      required:
      - can_cancel_until
      - date
      - end_at
      - id
      - manage_token
      - requester
      - rescheduled_from
      - rescheduled_to
      - reschedules_remaining
      - service
      - start_at
      - status
      - waitlist_position
      - worker_name
    AppointmentCancel:
      type: object
      description: Input serializer for appointment cancellation.
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
        force:
          type: boolean
          default: false
    AppointmentCreate:
      type: object
      description: Input serializer for creating/booking a new appointment.
      properties:
        requester:
          $ref: '#/components/schemas/RequesterInput'
        service:
          type: integer
          minimum: 1
        start_at:
          type: string
          format: date-time
      required:
      - requester
      - service
      - start_at
    AppointmentReschedule:
      type: object
      description: Input serializer for appointment rescheduling.
      properties:
        start_at:
          type: string
          format: date-time
        allow_waitlist:
          type: boolean
          default: false
        force:
          type: boolean
          default: false
      required:
      - start_at
    CodeEnum:
      enum:
      - domain_error
      - day_closed
      - quota_exceeded
      - no_worker_available
      - cancellation_not_allowed
      - reschedule_limit_reached
      - invalid_state_transition
      - invalid_duration
      - schedule_conflict
      - invalid_slot
      - outside_booking_window
      - requester_limit_reached
      - waitlist_full
      - appointment_not_found
      - service_not_found
      - worker_not_found
      - SCHEDULE_CHANGE_REQUIRES_CONFIRMATION
      - NOT_AUTHENTICATED
      - INVALID_TOKEN
      - INVALID_CREDENTIALS
      - LOGIN_LOCKED
      - FORBIDDEN
      - THROTTLED
      - APPOINTMENT_NOT_FOUND
      - EXCEPTION_NOT_FOUND
      - INVALID_PARAMETERS
      - VALIDATION_ERROR
      - SERVICE_UNAVAILABLE
      type: string
      description: |-
        * `domain_error` - domain_error
        * `day_closed` - day_closed
        * `quota_exceeded` - quota_exceeded
        * `no_worker_available` - no_worker_available
        * `cancellation_not_allowed` - cancellation_not_allowed
        * `reschedule_limit_reached` - reschedule_limit_reached
        * `invalid_state_transition` - invalid_state_transition
        * `invalid_duration` - invalid_duration
        * `schedule_conflict` - schedule_conflict
        * `invalid_slot` - invalid_slot
        * `outside_booking_window` - outside_booking_window
        * `requester_limit_reached` - requester_limit_reached
        * `waitlist_full` - waitlist_full
        * `appointment_not_found` - appointment_not_found
        * `service_not_found` - service_not_found
        * `worker_not_found` - worker_not_found
        * `SCHEDULE_CHANGE_REQUIRES_CONFIRMATION` - SCHEDULE_CHANGE_REQUIRES_CONFIRMATION
        * `NOT_AUTHENTICATED` - NOT_AUTHENTICATED
        * `INVALID_TOKEN` - INVALID_TOKEN
        * `INVALID_CREDENTIALS` - INVALID_CREDENTIALS
        * `LOGIN_LOCKED` - LOGIN_LOCKED
        * `FORBIDDEN` - FORBIDDEN
        * `THROTTLED` - THROTTLED
        * `APPOINTMENT_NOT_FOUND` - APPOINTMENT_NOT_FOUND
        * `EXCEPTION_NOT_FOUND` - EXCEPTION_NOT_FOUND
        * `INVALID_PARAMETERS` - INVALID_PARAMETERS
        * `VALIDATION_ERROR` - VALIDATION_ERROR
        * `SERVICE_UNAVAILABLE` - SERVICE_UNAVAILABLE
    DayAvailability:
      type: object
      description: Response serializer for day availability.
      properties:
        date:
          type: string
          format: date
        service:
          $ref: '#/components/schemas/ServiceSummary'
        is_open:
          type: boolean
        reason:
          type: string
          nullable: true
        effective_quota:
          type: integer
        remaining_quota:
          type: integer
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
      required:
      - date
      - effective_quota
      - is_open
      - reason
      - remaining_quota
      - service
      - slots
    DayConfigDetail:
      type: object
      description: Serializer for DayConfig model.
      properties:
        id:
          type: integer
          readOnly: true
        weekday:
          nullable: true
          title: Día de la semana (default)
          minimum: 0
          maximum: 9223372036854775807
          oneOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          - $ref: '#/components/schemas/NullEnum'
        date:
          type: string
          format: date
          nullable: true
          title: Fecha específica (override)
        max_appointments:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Cupo máximo de citas
          description: Dejar vacío para usar únicamente la capacidad calculada del
            personal. 0 es válido.
        is_open:
          type: boolean
          title: Abierto para citas
        note:
          type: string
          title: Nota / descripción
          maxLength: 255
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Actualizado el
      required:
      - id
      - updated_at
    DayConfigSummaryResponse:
      type: object
      description: Response serializer for DayConfig and capacity metrics summary.
      properties:
        date:
          type: string
          format: date
        day_config:
          $ref: '#/components/schemas/DayConfigDetail'
        is_open:
          type: boolean
        effective_quota:
          type: integer
          nullable: true
        quota_consumed:
          type: integer
        active_count:
          type: integer
        is_over_quota:
          type: boolean
        active_appointments_on_closed_day:
          type: integer
          default: 0
      required:
      - active_count
      - date
      - day_config
      - effective_quota
      - is_open
      - is_over_quota
      - quota_consumed
    DayConfigUpdate:
      type: object
      description: Input serializer for updating DayConfig date or weekday defaults.
      properties:
        max_appointments:
          type: integer
          minimum: 0
          nullable: true
        is_open:
          type: boolean
        note:
          type: string
          default: ''
          maxLength: 255
      required:
      - is_open
    ErrorResponse:
      type: object
      description: Standardized error response payload.
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/CodeEnum'
          description: |-
            Código único de error de dominio u operación.

            * `domain_error` - domain_error
            * `day_closed` - day_closed
            * `quota_exceeded` - quota_exceeded
            * `no_worker_available` - no_worker_available
            * `cancellation_not_allowed` - cancellation_not_allowed
            * `reschedule_limit_reached` - reschedule_limit_reached
            * `invalid_state_transition` - invalid_state_transition
            * `invalid_duration` - invalid_duration
            * `schedule_conflict` - schedule_conflict
            * `invalid_slot` - invalid_slot
            * `outside_booking_window` - outside_booking_window
            * `requester_limit_reached` - requester_limit_reached
            * `waitlist_full` - waitlist_full
            * `appointment_not_found` - appointment_not_found
            * `service_not_found` - service_not_found
            * `worker_not_found` - worker_not_found
            * `SCHEDULE_CHANGE_REQUIRES_CONFIRMATION` - SCHEDULE_CHANGE_REQUIRES_CONFIRMATION
            * `NOT_AUTHENTICATED` - NOT_AUTHENTICATED
            * `INVALID_TOKEN` - INVALID_TOKEN
            * `INVALID_CREDENTIALS` - INVALID_CREDENTIALS
            * `LOGIN_LOCKED` - LOGIN_LOCKED
            * `FORBIDDEN` - FORBIDDEN
            * `THROTTLED` - THROTTLED
            * `APPOINTMENT_NOT_FOUND` - APPOINTMENT_NOT_FOUND
            * `EXCEPTION_NOT_FOUND` - EXCEPTION_NOT_FOUND
            * `INVALID_PARAMETERS` - INVALID_PARAMETERS
            * `VALIDATION_ERROR` - VALIDATION_ERROR
            * `SERVICE_UNAVAILABLE` - SERVICE_UNAVAILABLE
        detail:
          type: string
          description: Mensaje explicativo para el usuario.
        impact:
          type: object
          additionalProperties: {}
          description: Desglose del impacto de cambios de horario cuando se requiere
            confirmación.
        errors:
          type: object
          additionalProperties: {}
          description: Detalles de validación de campos específicos si aplica.
      required:
      - code
      - detail
    HealthReadyResponse:
      type: object
      description: Health check readiness response payload.
      properties:
        status:
          type: string
          description: Estado del servicio ('ok' o 'unavailable').
        failing:
          type: array
          items:
            type: string
          description: Lista de componentes no disponibles (ej. 'database', 'cache').
      required:
      - status
    HealthStatusResponse:
      type: object
      description: Liveness response payload.
      properties:
        status:
          type: string
          description: Estado del proceso ('ok').
      required:
      - status
    KindEnum:
      enum:
      - ABSENCE
      - SPECIAL_HOURS
      type: string
      description: |-
        * `ABSENCE` - Ausencia
        * `SPECIAL_HOURS` - Horario especial
    Login:
      type: object
      description: Input serializer for user login.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      description: Output serializer for successful user login.
      properties:
        access:
          type: string
          description: Token de acceso JWT.
        refresh:
          type: string
          description: Token de refresco JWT.
      required:
      - access
      - refresh
    Logout:
      type: object
      description: Input serializer for JWT logout / token revocation.
      properties:
        refresh:
          type: string
      required:
      - refresh
    MeResponse:
      type: object
      description: Output serializer for current authenticated user profile.
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        worker_id:
          type: integer
          nullable: true
      required:
      - id
      - role
      - username
      - worker_id
    NullEnum:
      enum:
      - null
    PatchedWorkerPatch:
      type: object
      description: Input serializer for updating a worker's active status.
      properties:
        is_active:
          type: boolean
        confirm:
          type: boolean
          default: false
        dry_run:
          type: boolean
          default: false
    RequesterDetail:
      type: object
      description: Staff full requester detail serializer with all contact information.
