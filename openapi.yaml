  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Autenticación JWT para usuarios del sistema (Staff y Trabajadores).
        Cabecera: ''Authorization: Bearer <access_token>''.'
    ManageTokenAuth:
      type: apiKey
      in: header
      name: X-Manage-Token
      description: 'Token de gestión entregado al solicitante en la creación o reprogramación.
        Cabecera: ''X-Manage-Token: <token>''.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
